name: Backend CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/kusafe-2025/backend
  AI_ASSISTANT_IMAGE: ghcr.io/kusafe-2025/ai-assistant-service
  GAME_MODERATION_IMAGE: ghcr.io/kusafe-2025/game-moderation-service
  DEPLOY_DIR: /opt/kusafe

jobs:
  test-backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore KuSaFeBackend.csproj
          dotnet restore Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj

      - name: Build
        run: |
          dotnet build KuSaFeBackend.csproj --configuration Release --no-restore
          dotnet build Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj --configuration Release --no-build

  test-ai-assistant-service:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ai-assistant-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-assistant-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: PYTHONPATH=. python -m pytest -q

  test-game-moderation-service:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: game-moderation-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: game-moderation-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: PYTHONPATH=. python -m pytest -q

  build-and-deploy:
    needs: [test-backend, test-ai-assistant-service, test-game-moderation-service]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push ai-assistant-service image
        uses: docker/build-push-action@v6
        with:
          context: ai-assistant-service
          file: ai-assistant-service/Dockerfile
          push: true
          tags: |
            ${{ env.AI_ASSISTANT_IMAGE }}:${{ github.ref_name }}
            ${{ env.AI_ASSISTANT_IMAGE }}:${{ github.sha }}

      - name: Build and push game-moderation-service image
        uses: docker/build-push-action@v6
        with:
          context: game-moderation-service
          file: game-moderation-service/Dockerfile
          push: true
          tags: |
            ${{ env.GAME_MODERATION_IMAGE }}:${{ github.ref_name }}
            ${{ env.GAME_MODERATION_IMAGE }}:${{ github.sha }}

      - name: Deploy over SSH with retries
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_JWT_KEY: ${{ secrets.PROD_JWT_KEY }}
          GHCR_READ_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/kusafe_deploy_key
          chmod 600 ~/.ssh/kusafe_deploy_key

          ssh_opts=(
            -i ~/.ssh/kusafe_deploy_key
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          compose_b64=$(base64 -w0 deploy/docker-compose.prod.yml)
          remote_prefix=$(
            printf 'DEPLOY_DIR=%q POSTGRES_PASSWORD=%q JWT_KEY=%q GHCR_READ_USER=%q GHCR_READ_TOKEN=%q BACKEND_TAG=%q FRONTEND_TAG=%q AI_ASSISTANT_TAG=%q GAME_MODERATION_TAG=%q COMPOSE_B64=%q bash -se' \
              '${{ env.DEPLOY_DIR }}' \
              "$PROD_POSTGRES_PASSWORD" \
              "$PROD_JWT_KEY" \
              "$GHCR_READ_USER" \
              "$GHCR_READ_TOKEN" \
              '${{ github.ref_name }}' \
              '${{ github.ref_name }}' \
              '${{ github.ref_name }}' \
              '${{ github.ref_name }}' \
              "$compose_b64"
          )

          for attempt in $(seq 1 5); do
            echo "Deploying (${attempt}/5)."
            if ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_prefix" <<'REMOTE_SCRIPT'
              set -euo pipefail

              mkdir -p "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"

              printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.prod.yml

              if [ ! -f .env ]; then
                printf '%s\n' \
                  'POSTGRES_DB=kusafe_db' \
                  'POSTGRES_USER=postgres' \
                  "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
                  "JWT_KEY=${JWT_KEY}" \
                  'OLLAMA_MODEL=llama3.1:8b' \
                  'MODERATION_VOTES=5' \
                  "BACKEND_TAG=${BACKEND_TAG}" \
                  "FRONTEND_TAG=${FRONTEND_TAG}" \
                  "AI_ASSISTANT_TAG=${AI_ASSISTANT_TAG}" \
                  "GAME_MODERATION_TAG=${GAME_MODERATION_TAG}" > .env
              fi

              # Always refresh the four image tags so the deploy picks up new builds.
              for var in BACKEND_TAG FRONTEND_TAG AI_ASSISTANT_TAG GAME_MODERATION_TAG; do
                val="${!var}"
                if grep -q "^${var}=" .env; then
                  sed -i "s/^${var}=.*/${var}=${val}/" .env
                else
                  printf '%s\n' "${var}=${val}" >> .env
                fi
              done

              printf '%s\n' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_READ_USER" --password-stdin
              docker compose -f docker-compose.prod.yml pull \
                backend ai-assistant-service game-moderation-service
              docker compose -f docker-compose.prod.yml up -d \
                postgres ollama ai-assistant-service game-moderation-service backend
              docker image prune -f

              for health_attempt in $(seq 1 60); do
                if curl -fsS http://127.0.0.1:5000/v1/health >/dev/null; then
                  echo "Backend healthcheck passed on attempt ${health_attempt}."
                  exit 0
                fi

                echo "Backend is not ready yet (${health_attempt}/60)."
                docker compose -f docker-compose.prod.yml ps backend
                sleep 2
              done

              echo "Backend did not become healthy in time."
              docker compose -f docker-compose.prod.yml ps
              docker logs --tail=200 kusafe-backend || true
              docker logs --tail=100 kusafe-ai-assistant || true
              docker logs --tail=100 kusafe-game-moderation || true
              exit 1
          REMOTE_SCRIPT
            then
              echo "Deploy succeeded."
              exit 0
            fi

            sleep_seconds=$((attempt * 5))
            echo "Deploy attempt failed; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done

          echo "Deploy failed after 5 attempts."
          exit 1
