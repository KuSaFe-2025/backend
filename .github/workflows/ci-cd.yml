name: Backend CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kusafe-2025/backend
  DEPLOY_DIR: /opt/kusafe

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore KuSaFeBackend.csproj
          dotnet restore Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj

      - name: Build
        run: |
          dotnet build KuSaFeBackend.csproj --configuration Release --no-restore
          dotnet build Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj --configuration Release --no-build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: mkdir -p "${{ env.DEPLOY_DIR }}"

      - name: Upload compose for first deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: deploy/docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_DIR }}"
            cd "${{ env.DEPLOY_DIR }}"
            if [ ! -f .env ]; then
              printf '%s\n' \
                'POSTGRES_DB=kusafe_db' \
                'POSTGRES_USER=postgres' \
                'POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}' \
                'JWT_KEY=${{ secrets.PROD_JWT_KEY }}' \
                'OLLAMA_MODEL=llama3.1:8b' \
                'BACKEND_TAG=main' \
                'FRONTEND_TAG=main' > .env
            fi
            echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_READ_USER }}' --password-stdin
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d postgres ollama backend
            docker image prune -f
            curl -fsS http://127.0.0.1:5000/v1/health >/dev/null
