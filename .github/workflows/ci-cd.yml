name: Backend CI/CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kusafe-2025/backend
  DEPLOY_DIR: /opt/kusafe

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore KuSaFeBackend.csproj
          dotnet restore Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj

      - name: Build
        run: |
          dotnet build KuSaFeBackend.csproj --configuration Release --no-restore
          dotnet build Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/KuSaFeBackend.Tests/KuSaFeBackend.Tests.csproj --configuration Release --no-build

  build-and-deploy:
    needs: test
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Upload compose with SSH retries
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/kusafe_deploy_key
          chmod 600 ~/.ssh/kusafe_deploy_key

          ssh_opts=(
            -i ~/.ssh/kusafe_deploy_key
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          scp_opts=(
            -i ~/.ssh/kusafe_deploy_key
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          for attempt in $(seq 1 5); do
            echo "Uploading compose file (${attempt}/5)."
            if ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '${{ env.DEPLOY_DIR }}'" &&
               scp "${scp_opts[@]}" deploy/docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:${{ env.DEPLOY_DIR }}/docker-compose.prod.yml"; then
              echo "Compose upload succeeded."
              exit 0
            fi

            sleep_seconds=$((attempt * 5))
            echo "Compose upload failed; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done

          echo "Compose upload failed after 5 attempts."
          exit 1

      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_DIR }}"
            cd "${{ env.DEPLOY_DIR }}"
            if [ ! -f .env ]; then
              printf '%s\n' \
                'POSTGRES_DB=kusafe_db' \
                'POSTGRES_USER=postgres' \
                'POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}' \
                'JWT_KEY=${{ secrets.PROD_JWT_KEY }}' \
                'OLLAMA_MODEL=llama3.1:8b' \
                'BACKEND_TAG=${{ github.ref_name }}' \
                'FRONTEND_TAG=${{ github.ref_name }}' > .env
            fi
            if grep -q '^BACKEND_TAG=' .env; then
              sed -i 's/^BACKEND_TAG=.*/BACKEND_TAG=${{ github.ref_name }}/' .env
            else
              printf '%s\n' 'BACKEND_TAG=${{ github.ref_name }}' >> .env
            fi
            echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_READ_USER }}' --password-stdin
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d postgres ollama backend
            docker image prune -f
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:5000/v1/health >/dev/null; then
                echo "Backend healthcheck passed on attempt ${attempt}."
                exit 0
              fi

              echo "Backend is not ready yet (${attempt}/60)."
              docker compose -f docker-compose.prod.yml ps backend
              sleep 2
            done

            echo "Backend did not become healthy in time."
            docker compose -f docker-compose.prod.yml ps
            docker logs --tail=200 kusafe-backend || true
            exit 1
