services:
  postgres:
    image: postgres:16-alpine
    container_name: kusafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kusafe_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-kusafe_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: kusafe-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ai-assistant-service:
    image: ghcr.io/kusafe-2025/ai-assistant-service:${AI_ASSISTANT_TAG:-main}
    container_name: kusafe-ai-assistant
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    environment:
      PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      LOG_LEVEL: INFO
    expose:
      - "8000"

  game-moderation-service:
    image: ghcr.io/kusafe-2025/game-moderation-service:${GAME_MODERATION_TAG:-main}
    container_name: kusafe-game-moderation
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    environment:
      PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      MODERATION_VOTES: ${MODERATION_VOTES:-5}
      LOG_LEVEL: INFO
    expose:
      - "8000"

  backend:
    image: ghcr.io/kusafe-2025/backend:${BACKEND_TAG:-main}
    container_name: kusafe-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-assistant-service:
        condition: service_started
      game-moderation-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-kusafe_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: KuSaFeBackend
      Jwt__Audience: KuSaFeFrontend
      Ai__BaseUrl: http://ai-assistant-service:8000
      Moderation__BaseUrl: http://game-moderation-service:8000
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    image: ghcr.io/kusafe-2025/frontend:${FRONTEND_TAG:-main}
    container_name: kusafe-frontend
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:5549:80"

volumes:
  postgres_data:
  ollama_data:
